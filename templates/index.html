<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Gerador 2FA</title>

    <style>
        body{
            background:#0f172a;
            color:white;
            font-family:Arial;
            display:flex;
            justify-content:center;
            align-items:center;
            height:100vh;
        }

        .card{
            background:#1e293b;
            padding:40px;
            border-radius:15px;
            width:350px;
        }

        input{
            width:100%;
            padding:14px;
            border:none;
            border-radius:8px;
            margin-bottom:15px;
        }

        button{
            width:100%;
            padding:14px;
            background:#2563eb;
            border:none;
            border-radius:8px;
            color:white;
            cursor:pointer;
        }

        .codigo{
            font-size:40px;
            text-align:center;
            margin-top:20px;
            color:#4ade80;
        }

        .erro{
            background:red;
            padding:10px;
            border-radius:8px;
            margin-top:15px;
        }
    </style>
</head>
<body>

<div class="card">

    <h1>Gerador 2FA</h1>

    <form method="POST" action="/gerar">

        <input
            type="text"
            name="secret"
            placeholder="Digite sua chave secreta"
            required
        >

        <button type="submit">
            Gerar Código
        </button>

    </form>

    {% if codigo %}
        <div class="codigo">
            {{ codigo }}
        </div>
    {% endif %}

    {% if erro %}
        <div class="erro">
            {{ erro }}
        </div>
    {% endif %}

</div>

</body>
</html>
